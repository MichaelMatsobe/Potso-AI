services:
  potso-ai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      API_PORT: "8080"
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      FREEBUFF_BASE_URL: ${FREEBUFF_BASE_URL:-}
      FREEBUFF_API_KEY: ${FREEBUFF_API_KEY:-}
      FREEBUFF_MODEL: ${FREEBUFF_MODEL:-deepseek/deepseek-v4-pro}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      API_ACCESS_KEY: ${API_ACCESS_KEY:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RETENTION_CHAT_DAYS: ${RETENTION_CHAT_DAYS:-180}
      RETENTION_MESSAGE_DAYS: ${RETENTION_MESSAGE_DAYS:-180}
      RETENTION_DSAR_EXPORT_DAYS: ${RETENTION_DSAR_EXPORT_DAYS:-30}
      RETENTION_DSAR_TICKET_DAYS: ${RETENTION_DSAR_TICKET_DAYS:-730}
      RETENTION_AUTO_PURGE: ${RETENTION_AUTO_PURGE:-true}
      RETENTION_PURGE_INTERVAL_HOURS: ${RETENTION_PURGE_INTERVAL_HOURS:-24}
      VOICE_STT_URL: ${VOICE_STT_URL:-}
      VOICE_TTS_URL: ${VOICE_TTS_URL:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-}
    volumes:
      - potso_data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
  potso_data:
