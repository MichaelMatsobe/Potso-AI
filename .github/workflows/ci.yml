name: CI

on:
  push:
    branches: [dev/freebuff-provider, main, master]
  pull_request:
    branches: [dev/freebuff-provider, main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: SOP artifacts
        run: npm run sop-check
      - name: Unit tests
        run: npm run test:unit
      - name: Perf (local, no server)
        run: npm run test:perf
